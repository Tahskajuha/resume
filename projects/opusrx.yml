bullets:
  - Built and maintained a cross-platform RTP audio receiver library featuring configurable latency control, jitter buffering, and real-time audio playback.
  - Designed thread-safe queue-based packet ingestion and pull-based playback API for real-time audio playback.
  - Implemented queue-depth-based latency regulation, Opus PLC/FEC support, JNI bindings, and platform integration tooling for Linux and Android deployments.
