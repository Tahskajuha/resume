bullets:
  - Designed and produced an educational animation exploring MSP430 microcontroller architecture, packaging, and internal organization.
  - Hand-modeled the microcontroller from package enclosure to abstracted silicon die representations using Blender.
  - Created educational visualizations of memory regions, core components, bonding structures, and interconnect concepts to illustrate microcontroller operation.
