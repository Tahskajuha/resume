title: remoteSubmixStreamer
link: https://github.com/Tahskajuha/remote-submix-streamer
start: Mar 2026
end: Present

technologies:
  - Kotlin
  - Android
  - RTP/UDP
  - OPUS

bullets:
  - Developed an Android audio capture client that acquires stereo 48 kHz PCM audio from REMOTE-SUBMIX and streams it to remote receivers using RTP over UDP.
  - Implemented OPUS encoding, RTP packetization, timestamp management, and sequence tracking for low-latency real-time audio delivery.
  - Built a lightweight Android interface featuring persistent target configuration and service-state synchronization to simplify deployment and day-to-day operation.
